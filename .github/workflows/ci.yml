name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala uv e Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instala dependências
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests streamlit_app.py main.py

      - name: Testes
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=20
